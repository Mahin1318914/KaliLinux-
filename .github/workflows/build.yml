name: Build KaliBox APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest uploaded zip
        run: |
          ZIP="$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip')"
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KaliBox-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
